name: Calista Technologies
description: Calista Technologies was a desktop and GPU virtualization startup founded in 2006 in San
  Jose, California by Neal Margulis, backed by Lightspeed Venture Partners, Greylock, and Western
  Technology Investment. Its software improved the user experience of 3-D and multimedia delivery for
  virtualized desktop deployments and server-hosted applications running on Windows Server Terminal
  Services (Remote Desktop). Microsoft acquired the company in 2008 and folded its GPU-virtualization
  technology into RemoteFX. The company is defunct and publishes no live developer, documentation, or
  API surface; its former domain (calistatechnologies.com) is now a parked domain listed for sale.
